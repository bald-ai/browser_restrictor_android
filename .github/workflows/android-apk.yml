name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "scripts/test-android.sh"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Restore consistent APK signing and validate configuration
        shell: bash
        run: |
          test -n "$ANDROID_DEBUG_KEYSTORE_BASE64" || { echo "Missing ANDROID_DEBUG_KEYSTORE_BASE64 repository secret"; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Install Android SDK packages
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          log-accepted-android-sdk-licenses: false
      - name: Test and build installable APK
        run: ANDROID_DEBUG_KEYSTORE_PATH="$HOME/.android/debug.keystore" bash scripts/test-android.sh --no-daemon :app:compileDebugAndroidTestKotlin lintDebug assembleDebug
      - name: Verify application identity
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/apk-badging.txt"
          grep -F "package: name='com.michalkrsik.browserrestrictor'" "$RUNNER_TEMP/apk-badging.txt"
          keytool -exportcert -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android > "$RUNNER_TEMP/signing-cert.der"
          expected_cert=$(sha256sum "$RUNNER_TEMP/signing-cert.der" | cut -d ' ' -f 1)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/apk-signing.txt"
          grep -F "Signer #1 certificate SHA-256 digest: $expected_cert" "$RUNNER_TEMP/apk-signing.txt"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: internet-restrictor-android
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
